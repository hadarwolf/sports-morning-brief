# Daily Brief sources. Sections: sports, geopolitics, israeli_politics, business, ideas, learn.
# Any source can be turned off with `enabled = false`.
#
# RSS options: id, name, section, lang, url, max_age_hours (default 48), max_items (default 25),
#              browser_ua (send a browser User-Agent; some publishers 403 bots).
#
# Several publishers (Reuters, AP) no longer publish RSS. For those we use a Google News
# RSS search scoped to the site — same headlines, links redirect to the original article.

# ---------------------------------------------------------------- API sources

[football_data]
description = "football-data.org: matches (yesterday..tomorrow), big-5 standings, Arsenal/Barça"
# PL=Premier League, PD=La Liga, BL1=Bundesliga, SA=Serie A, FL1=Ligue 1
standings = ["PL", "PD", "BL1", "SA", "FL1"]
favorite_window_days = 14

[football_data.favorite_teams]
arsenal = 57
barcelona = 81

[balldontlie]
description = "balldontlie.io: last night's NBA games + Israeli players"
israeli_players = ["Deni Avdija", "Ben Saraf"]

[thesportsdb]
description = "TheSportsDB: Inter Miami (MLS) + Israel national team"

[thesportsdb.teams]
inter_miami = 137699
israel_national_team = 135931

[markets]
description = "yfinance: TA-35, S&P 500, USD/ILS, Brent, BTC"

[markets.tickers]
TA35 = "TA35.TA"
SP500 = "^GSPC"
USDILS = "ILS=X"
BRENT = "BZ=F"
BTC = "BTC-USD"

[wikipedia]
description = "Wikipedia On This Day (selected events)"
langs = ["en"]  # he.wikipedia doesn't publish this feed; Phase 2 translates

