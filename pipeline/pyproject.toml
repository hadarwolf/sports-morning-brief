[project]
name = "daily-brief-pipeline"
version = "0.1.0"
description = "Daily Brief content pipeline: fetch sources, summarize with Claude, emit JSON for the PWA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",
    "tzdata>=2024.1",  # zoneinfo data on Windows
    "pydantic>=2.13.5",
]

[project.scripts]
daily-brief = "daily_brief.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
